name: Release

# Every push to main that changes the app publishes the next version (scripts/next-version.sh):
# patch by default, minor or major with "[minor]" or "[major]" in a commit message.
# Commits that only touch docs don't release, and "[skip ci]" in the message skips one that would.
on:
  push:
    branches: [main]
    paths:
      - Sources/**
      - Resources/**
      - Package.swift
      - scripts/build-app.sh
  workflow_dispatch:
    inputs:
      bump:
        description: Parte da versão que sobe
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# One release at a time, so each run sees the tag the previous one created.
concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags and history, for the version and the release notes

      - name: Next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: echo "version=$(./scripts/next-version.sh "${BUMP:-auto}")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./scripts/test.sh

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/build-app.sh
          ditto -c -k --keepParent build.noindex/Notinhas.app build.noindex/Notinhas.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          git log ${previous:+"$previous..HEAD"} --no-merges --format='- %s' > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" build.noindex/Notinhas.zip \
            --target "$GITHUB_SHA" --title "Notinhas $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
